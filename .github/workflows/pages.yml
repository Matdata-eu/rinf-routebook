name: GitHub Pages

# Publishes the public demo on GitHub Pages, with the complete RINF data: every dataset on the
# ERA endpoint, one per country (see `routebook fetch-all`). The site is static, so it uses the
# configuration and privacy statement in deploy/github-pages/ (Matdata as publisher, GitHub as host).
#
# Runs every Monday (RINF data changes slowly) and on demand. To try a few countries first,
# run it by hand with e.g. "NOR,BEL" as datasets. Needs Settings > Pages > Source: GitHub Actions.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      datasets:
        description: "Dataset ids to fetch, comma separated (empty: all of RINF)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      ROUTEBOOK_CONFIG_FILE: deploy/github-pages/config.json
      # the large networks (Germany, France, ...) need more than Node's default heap
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Fetch the RINF data
        run: pnpm routebook fetch-all ${DATASETS:+--only "$DATASETS"}
        env:
          DATASETS: ${{ inputs.datasets }}
      - name: Build the web app with the data
        run: pnpm --filter @routebook/web build
      - name: Add the configuration and privacy statement
        run: node scripts/build-static.mjs apps/web/dist
      - name: Site size
        run: du -sh apps/web/dist && du -sh apps/web/dist/*/ | sort -h | tail -n 10
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
