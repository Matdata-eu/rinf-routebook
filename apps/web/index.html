<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Open-source railway routebook built on ERA RINF data" />
    <title>Routebook</title>
    <link rel="icon" type="image/svg+xml" href="./src/favicon.svg" />
    <meta name="theme-color" content="#0563bb" />
  </head>
  <body data-state="loading">
    <div id="disclaimer" class="disclaimer" role="note" hidden></div>
    <div id="print-stamp" class="print-stamp" aria-hidden="true" hidden></div>
    <header class="topbar">
      <h1 class="brand"><svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><g transform="translate(0 -1)" fill="none" stroke="#0563bb" stroke-width="3.6" stroke-linejoin="round"><path d="M9.1 32 H11.4"/><path d="M24.6 32 H38.9"/><path d="M22.67 27.33 L35 15 H38.9"/><circle cx="5.5" cy="32" r="3.6"/><circle cx="42.5" cy="32" r="3.6"/><circle cx="42.5" cy="15" r="3.6"/><circle cx="18" cy="32" r="6.6"/><circle cx="18" cy="32" r="2.4" fill="#0563bb" stroke="none"/></g></svg><span id="brand">Routebook</span></h1>
      <form class="picker" autocomplete="off" onsubmit="return false">
        <div class="field" hidden>
          <label for="dataset">Network</label>
          <select id="dataset" title="RINF dataset"></select>
        </div>
        <div class="field">
          <label for="from">From</label>
          <input id="from" type="search" placeholder="Station name or code" spellcheck="false" />
        </div>
        <button id="swap" type="button" class="btn icon" title="Swap origin and destination" aria-label="Swap origin and destination">⇅</button>
        <div class="field">
          <label for="to">To</label>
          <input id="to" type="search" placeholder="Station name or code" spellcheck="false" />
        </div>
        <button id="clear" type="button" class="btn" title="Clear route">Clear</button>
      </form>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <button id="datasets-btn" type="button" class="btn chip" hidden title="Which RINF datasets this Routebook works on"></button>
    </header>
    <main class="layout">
      <div class="stage">
        <div class="view-tabs" role="tablist" aria-label="View">
          <button id="tab-map" type="button" role="tab" aria-selected="true" aria-controls="map">Map</button>
          <button id="tab-schematic" type="button" role="tab" aria-selected="false" aria-controls="schematic">Schematic</button>
          <button id="tab-drive" type="button" role="tab" aria-selected="false" aria-controls="map" title="Follow a train along the route, satnav style">Drive</button>
        </div>
        <div id="map" class="map" role="tabpanel" aria-label="Map"></div>
        <section id="schematic" class="schematic" role="tabpanel" aria-label="Schematic track layout" hidden>
          <div class="sch-tools">
            <button id="sch-out" type="button" class="btn icon" title="Zoom out" aria-label="Zoom out">−</button>
            <button id="sch-in" type="button" class="btn icon" title="Zoom in (or Ctrl / Cmd + mouse wheel)" aria-label="Zoom in">+</button>
            <button id="sch-fit" type="button" class="btn" title="Zoom the whole route into the view">Fit</button>
            <span class="sch-legend">
              <span><i class="lg lg-route"></i>route</span>
              <span><i class="lg lg-running"></i>running track</span>
              <span><i class="lg lg-siding"></i>siding</span>
              <span><i class="lg lg-switch"></i>switch</span>
              <span class="muted">Up = left of the direction of travel. Open line is compressed.</span>
            </span>
          </div>
          <div id="sch-scroll" class="sch-scroll"></div>
        </section>
      </div>
      <aside class="panel">
        <details class="filters-box">
          <summary>Show in routebook</summary>
          <div id="filters" class="filters"></div>
        </details>
        <section id="routebook" class="routebook"></section>
        <footer class="panel-foot"><span id="meta"></span> · <span id="rinf-credit">RINF data © European Union Agency for Railways</span> · <a href="https://github.com/Matdata-eu/rinf-routebook" target="_blank" rel="noopener">Routebook</a>, open source (MIT) by <a href="https://matdata.eu" target="_blank" rel="noopener">MatData</a> · <a href="https://github.com/Matdata-eu/rinf-routebook/issues" target="_blank" rel="noopener">Report an issue</a><span id="privacy" hidden> · <a target="_blank" rel="noopener"></a></span></footer>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
